name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm audit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          pnpm start > /tmp/barbearia-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/catalog > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            output/playwright
            output/e2e-results.json
            playwright-report
